<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARIA - Acme Travel</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
  <header class="topbar"><a href="../index.html">Home</a></header>
  <main>
    <h1>ARIA misuse samples</h1>

    <!-- ISSUE: aria-roles — invalid role -->
    <div role="buton">Book now</div>

    <!-- ISSUE: aria-valid-attr — misspelled aria attribute -->
    <button aria-lable="Close">X</button>

    <!-- ISSUE: aria-valid-attr-value — invalid value -->
    <button aria-expanded="yes">Show details</button>
    <div aria-live="loud">Status updates here</div>

    <!-- ISSUE: aria-required-attr — checkbox role missing aria-checked -->
    <div role="checkbox" tabindex="0">Add travel insurance</div>

    <!-- ISSUE: aria-required-children — list role without listitems -->
    <div role="list">
      <div>Lisbon</div>
      <div>Porto</div>
    </div>

    <!-- ISSUE: aria-required-parent — tab outside tablist -->
    <div role="tab">Itinerary</div>

    <!-- ISSUE: aria-hidden-focus — focusable content inside aria-hidden -->
    <div aria-hidden="true">
      <a href="forms.html">Hidden but focusable link</a>
      <button>Hidden button</button>
    </div>

    <!-- ISSUE: aria-hidden-body would be on body; here hidden heading content -->
    <h2 aria-hidden="true">Important notice</h2>

    <!-- ISSUE: aria-allowed-attr — attribute not allowed on role -->
    <a href="#" aria-checked="true">Saved trips</a>

    <!-- ISSUE: aria-allowed-role — role not allowed on element -->
    <ul role="button"><li>Weird list button</li></ul>

    <!-- ISSUE: aria-command-name / aria-toggle-field-name — roles without names -->
    <div role="button" tabindex="0"></div>
    <div role="switch" aria-checked="false" tabindex="0"></div>

    <!-- ISSUE: aria-progressbar-name -->
    <div role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="width:200px;height:10px;background:#eee"><div style="width:40%;height:100%;background:#2b6cb0"></div></div>

    <!-- ISSUE: aria-labelledby points to missing id -->
    <section aria-labelledby="does-not-exist"><p>Trip summary</p></section>

    <!-- ISSUE: aria-dialog-name + modal without focus management -->
    <p><span class="fake-button" onclick="document.getElementById('m').classList.add('open')">Open dialog</span></p>
    <div id="m" class="modal" role="dialog">
      <div class="modal-box">
        <p>Your session will expire in 2 minutes.</p>
        <span class="fake-button" onclick="document.getElementById('m').classList.remove('open')">OK</span>
      </div>
    </div>

    <!-- ISSUE: presentation-role-conflict — role=none on focusable element -->
    <button role="none">Remove</button>
  </main>
  <footer class="site-footer"><p>DEQUE-TEST-AJAY</p></footer>
</body>
</html>
